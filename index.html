<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>💬 LINE 群組活動布告欄</title>
  
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Native LINE UI Style CSS Embedded -->
  <style>
    /* ==========================================================================
       NATIVE LINE CHAT UI DESIGN SYSTEM (SEAMLESS LINE STYLE)
       ========================================================================== */

    :root {
      /* LINE Palette */
      --line-green: #06C755;
      --line-green-dark: #05b34c;
      --line-green-light: #e6f9ed;
      --line-bg: #8cabd9; /* Classic LINE Chatroom Blue-Gray */
      --line-card-bg: #ffffff;
      --line-text-main: #1e1e1e;
      --line-text-sub: #666666;
      --line-border: #e2e8f0;
      --line-red: #ff4b4b;
      --line-yellow: #ffb800;
      
      /* System Font */
      --font-line: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--line-bg);
      color: var(--line-text-main);
      font-family: var(--font-line);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Native LINE Header */
    .line-header {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--line-green);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .user-name {
      font-weight: 700;
      color: #0f172a;
    }

    .dev-btn {
      background: #ffffff;
      border: 1px solid var(--line-green);
      color: var(--line-green);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }

    .dev-btn:hover {
      background: var(--line-green);
      color: #ffffff;
    }

    /* Top Announcement Notice Board */
    .notice-board {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      border-left: 5px solid var(--line-yellow);
    }

    .notice-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .notice-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notice-content {
      background: #fffbeb;
      border: 1px solid #fef3c7;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      color: #92400e;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 8px;
    }

    .notice-meta {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Navigation Pill Tabs */
    .nav-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      align-items: center;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: none;
      color: #475569;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .tab-btn.active {
      background: var(--line-green);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(6, 199, 85, 0.3);
    }

    .export-btn {
      background: #1e293b;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-left: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      white-space: nowrap;
    }

    .export-btn:hover {
      background: #0f172a;
    }

    /* LINE Event Cards */
    .event-card {
      background: var(--line-card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .event-card.ended {
      background: #f8fafc;
      opacity: 0.85;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .tag-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .tag-open {
      background: var(--line-green-light);
      color: var(--line-green-dark);
    }

    .tag-full {
      background: #ffebe6;
      color: var(--line-red);
    }

    .tag-ended {
      background: #e2e8f0;
      color: #64748b;
    }

    .card-info {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .info-row {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: #64748b;
      font-weight: 600;
      min-width: 60px;
    }

    .location-link {
      color: #2563eb;
      text-decoration: underline;
      font-weight: 600;
      word-break: break-all;
    }

    .location-link:hover {
      color: #1d4ed8;
    }

    /* Card Attendees Preview Pills */
    .attendee-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 3px 8px 3px 4px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .attendee-pill img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Card Buttons Grid */
    .card-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 6px;
      margin-top: 10px;
    }

    .line-btn {
      font-family: var(--font-line);
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-join {
      background: var(--line-green);
      color: #ffffff;
    }

    .btn-join:hover {
      background: var(--line-green-dark);
    }

    .btn-cancel {
      background: #ef4444;
      color: #ffffff;
    }

    .btn-cancel:hover {
      background: #dc2626;
    }

    .btn-detail {
      background: #f1f5f9;
      color: #334155;
    }

    .btn-detail:hover {
      background: #e2e8f0;
    }

    .btn-edit {
      background: #fef3c7;
      color: #d97706;
      border: 1px solid #fde68a;
    }

    .btn-edit:hover {
      background: #fde68a;
      color: #b45309;
    }

    .btn-calendar {
      background: #eff6ff;
      color: #2563eb;
    }

    .btn-calendar:hover {
      background: #dbeafe;
    }

    .btn-delete {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }

    .btn-delete:hover {
      background: #fca5a5;
      color: #7f1d1d;
    }

    /* Floating Action Button (FAB) Group (宣傳 & 揪團) */
    .fab-group {
      position: fixed;
      bottom: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      z-index: 100;
    }

    .fab-btn {
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-family: var(--font-line);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .fab-btn:hover {
      transform: scale(1.04);
    }

    .fab-add {
      background: var(--line-green);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(6, 199, 85, 0.4);
    }

    .fab-add:hover {
      background: var(--line-green-dark);
    }

    .fab-broadcast {
      background: #ffb800;
      color: #0f172a;
      box-shadow: 0 4px 16px rgba(255, 184, 0, 0.4);
    }

    .fab-broadcast:hover {
      background: #e6a600;
    }

    /* Native Full Screen Sheet Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 100%;
      background: #ffffff;
      border-radius: 0;
      padding: 0;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
        padding: 16px;
      }
      .modal-box {
        border-radius: 20px;
        height: auto;
        max-height: 85vh;
      }
    }

    .modal-header {
      flex-shrink: 0;
      background: #ffffff;
      padding: 16px 18px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .modal-title-text {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .modal-close {
      background: #f1f5f9;
      border: none;
      color: #64748b;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .modal-form-body {
      flex: 1 1 auto;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 18px 18px 90px 18px;
    }

    .modal-footer {
      flex-shrink: 0;
      padding: 14px 18px;
      border-top: 1px solid #f1f5f9;
      background: #ffffff;
      z-index: 10;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }

    .line-input, .line-textarea {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      padding: 12px;
      border-radius: 10px;
      font-family: var(--font-line);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="datetime-local"].line-input {
      min-height: 46px;
      color: #0f172a;
      background-color: #f8fafc;
      cursor: pointer;
    }

    .line-input:focus, .line-textarea:focus {
      border-color: var(--line-green);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15);
    }

    .line-textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* History Log List */
    .history-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #e2e8f0;
      max-height: 140px;
      overflow-y: auto;
    }

    .history-item {
      font-size: 12px;
      color: #475569;
      padding: 6px 0;
      border-bottom: 1px dashed #cbd5e1;
      line-height: 1.4;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-meta {
      font-weight: bold;
      color: var(--line-green-dark);
    }

    /* Alert Textbox */
    .alert-text-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      color: #334155;
      margin: 14px 0;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      text-align: left;
      line-height: 1.6;
      border-left: 4px solid var(--line-green);
    }

    /* Dev Profile Cards */
    .dev-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .dev-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      color: #334155;
      transition: all 0.2s;
    }

    .dev-card.active, .dev-card:hover {
      border-color: var(--line-green);
      background: var(--line-green-light);
      color: var(--line-green-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LINE Native Header -->
    <header class="line-header">
      <div class="header-top">
        <h1 class="brand-title">
          <span>💬 群組活動布告欄</span>
        </h1>
        <span id="login-badge" style="font-size: 12px; color: var(--line-green); background: var(--line-green-light); padding: 3px 8px; border-radius: 10px; font-weight: 700;">LIFF 載入中...</span>
      </div>
      
      <div class="user-status-bar">
        <div>
          <span style="color: #64748b;">登入身份：</span>
          <span id="current-name" class="user-name">載入中...</span>
        </div>
        <button id="btn-login-action" class="dev-btn" style="display:inline-block; border-color:var(--line-green); color:var(--line-green);">🔑 LINE 登入</button>
        <button id="btn-dev-toggle" class="dev-btn">⚙️ 測試切換身分</button>
      </div>
    </header>

    <!-- Top Announcement Board -->
    <section class="notice-board">
      <div class="notice-title-row">
        <div class="notice-title">📌 群組重要公告</div>
        <div style="display:flex; gap:6px;">
          <button id="btn-edit-notice" class="line-btn btn-edit" style="padding:3px 8px; font-size:12px;">✏️ 發表/修改</button>
          <button id="btn-notice-history" class="line-btn btn-detail" style="padding:3px 8px; font-size:12px;">📜 歷史留言</button>
        </div>
      </div>
      <div id="notice-text-content" class="notice-content">
        載入公告中...
      </div>
      <div class="notice-meta">
        <span id="notice-author-info">由 管理員 發布</span>
        <span id="notice-time-info">--</span>
      </div>
    </section>

    <!-- Navigation Tabs (Default: 報名中) -->
    <nav class="nav-filters">
      <button class="tab-btn active" data-filter="open">報名中</button>
      <button class="tab-btn" data-filter="all">全部</button>
      <button class="tab-btn" data-filter="ended">已過期</button>
      <button class="tab-btn" data-filter="my">我參加的</button>
      
      <button id="btn-export-ended" class="export-btn" style="display: none;">
        📋 匯出歷史紀錄
      </button>
    </nav>

    <!-- Event Cards Container -->
    <main id="event-list">
      <!-- Dynamic Rendered Event Cards -->
    </main>

  </div>

  <!-- Floating Action Buttons Group (宣傳 & 揪團) -->
  <div class="fab-group">
    <button id="btn-broadcast-all" class="fab-btn fab-broadcast">
      <span>宣傳</span>
    </button>
    <button id="fab-add-event" class="fab-btn fab-add">
      <span>揪團</span>
    </button>
  </div>

  <!-- Modal: Edit Top Announcement / Notice -->
  <div id="modal-edit-notice" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title-text">發表/更新頂部公告</span>
        <button class="modal-close" data-close="modal-edit-notice">✕</button>
      </div>
      <form id="form-edit-notice" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
        <div class="modal-form-body">
          <div class="form-group">
            <label class="form-label">公告內容 (發布後會更新至頂部，並留存留言紀錄)</label>
            <textarea id="input-notice-text" class="line-textarea" style="min-height:140px;" placeholder="寫下要提醒群組大家的注意事項..." required></textarea>
          </div>
        </div>
        <div class="modal-footer" style="display:flex; gap:10px;">
          <button type="button" class="line-btn btn-detail" style="flex:1;" data-close="modal-edit-notice">取消</button>
          <button type="submit" class="line-btn btn-join" style="flex:1.5;">發布公告並複製通報</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Notice History Logs -->
  <div id="modal-notice-history" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title-text">頂部公告歷史留言紀錄</span>
        <button class="modal-close" data-close="modal-notice-history">✕</button>
      </div>
      <div class="modal-form-body">
        <div id="notice-history-container" class="history-box" style="max-height:100%;">
          <!-- Rendered History -->
        </div>
      </div>
      <div class="modal-footer" style="text-align:right;">
        <button class="line-btn btn-detail" data-close="modal-notice-history">關閉</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create Event (發起揪團) -->
  <div id="modal-create" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title-text">發起揪團</span>
        <button class="modal-close" data-close="modal-create">✕</button>
      </div>
      <form id="form-create-event" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
        <div class="modal-form-body">
          <div class="form-group">
            <label class="form-label">活動名稱 *</label>
            <input type="text" id="input-title" class="line-input" placeholder="例如：週末羽球同樂會" required>
          </div>
          <div class="form-group">
            <label class="form-label">日期與時間 * (點擊選擇)</label>
            <input type="datetime-local" id="input-datetime" class="line-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">活動地點 (選填，可輸入地址或貼上地圖網址)</label>
            <input type="text" id="input-location" class="line-input" placeholder="例如：台北市立羽球館 (選填)">
          </div>
          <div class="form-group">
            <label class="form-label">主揪 / 主辦人名稱</label>
            <input type="text" id="input-host-name" class="line-input" placeholder="預設為當前 LINE 暱稱（可修改）">
          </div>
          <div class="form-group">
            <label class="form-label">活動費用</label>
            <input type="text" id="input-fee" class="line-input" placeholder="例如：$200 / 人 或 免費">
          </div>
          <div class="form-group">
            <label class="form-label">人數上限 (0 代表無限制)</label>
            <input type="number" id="input-max" class="line-input" value="8" min="0">
          </div>
          <div class="form-group">
            <label class="form-label">補充說明</label>
            <textarea id="input-desc" class="line-textarea" placeholder="例如：請自備球拍、穿著運動鞋！"></textarea>
          </div>
        </div>
        <div class="modal-footer" style="display:flex; gap:10px;">
          <button type="button" class="line-btn btn-detail" style="flex:1;" data-close="modal-create">取消</button>
          <button type="submit" class="line-btn btn-join" style="flex:1.5; padding:10px;">發起揪團</button>
        </div>

  <script>
    /* ==========================================================================

    // --- 1. CONFIG & STATE ---
    const CONFIG = {
      LIFF_ID: "2010984505-Nv6CpgYO",

    // DEV Mock Profiles

    // --- CROSS-PLATFORM UTILS ---
    function safeCopyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(() => fallbackCopyText(text));
      } else {
        fallbackCopyText(text);
        return Promise.resolve();
      }
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(textArea);
    }

    function parseSafeDate(dateStr) {
      if (!dateStr) return new Date();
      if (dateStr instanceof Date) return dateStr;
      const cleanStr = String(dateStr).replace(/-/g, "/").replace("T", " ");
      const d = new Date(cleanStr);
      if (isNaN(d.getTime())) return new Date(dateStr);
      return d;
    }

    function getShareableUrl() {
      return (CONFIG.LIFF_URL && CONFIG.LIFF_URL.indexOf("liff.line.me") >= 0)
        ? CONFIG.LIFF_URL
        : window.location.href;
    }

    // --- 2. INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", () => {
      checkDevModeVisibility();
      
      loadLocalData();
      renderNoticeBoard();
      renderEvents();
      setupEventListeners();
      renderDevProfiles();
      setupInputFocusScroll();

      initLIFF();
      fetchRemoteDataFromGAS().then(() => {
        renderNoticeBoard();
        renderEvents();
      });
    });

    function setupInputFocusScroll() {
      document.querySelectorAll("input, textarea").forEach(el => {
        el.addEventListener("focus", () => {
          setTimeout(() => {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 300);
        });
      });
    }

    function checkDevModeVisibility() {
      const urlParams = new URLSearchParams(window.location.search);
      const isDevParam = urlParams.get('dev') === 'true';
      const devBtn = document.getElementById("btn-dev-toggle");
      if (isDevParam) {
        devBtn.style.display = "inline-block";
      } else {
        devBtn.style.display = "none";
      }
    }

    // --- 3. LIFF AUTH & PERSISTENT SESSION ---
    async function initLIFF() {
      const badgeEl = document.getElementById("login-badge");
      const loginBtn = document.getElementById("btn-login-action");

      const cached = localStorage.getItem(CONFIG.USER_CACHE_KEY);
      if (cached) {
        try {
          currentUser = JSON.parse(cached);
          updateUserUI();
        } catch(e) {}
      }

      if (CONFIG.LIFF_ID && typeof liff !== "undefined") {
        try {
          await liff.init({ liffId: CONFIG.LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUser = {
              userId: profile.userId,
              displayName: profile.displayName,
              pictureUrl: profile.pictureUrl || "https://api.dicebear.com/7.x/pixel-art/svg?seed=" + profile.displayName
            };
            localStorage.setItem(CONFIG.USER_CACHE_KEY, JSON.stringify(currentUser));
            badgeEl.innerText = "已連動 LINE";
            badgeEl.style.background = "var(--line-green-light)";
            badgeEl.style.color = "var(--line-green-dark)";
            loginBtn.innerText = "已登入";
            loginBtn.style.borderColor = "var(--line-green)";
            loginBtn.onclick = null;
          } else {
            badgeEl.innerText = "未登入 LINE";
            badgeEl.style.background = "#fee2e2";
            badgeEl.style.color = "#dc2626";
            loginBtn.innerText = "點此登入";
            loginBtn.onclick = () => liff.login();

            if (!currentUser && liff.isInClient()) {
              liff.login();
            }
          }
        } catch (err) {
          console.warn("LIFF init warning:", err);
          if (!currentUser) currentUser = DEV_PROFILES[0];
        }
      } else {
        if (!currentUser) currentUser = DEV_PROFILES[0];
      }

      updateUserUI();
    }

    function updateUserUI() {
      if (currentUser) {
        document.getElementById("current-name").innerText = currentUser.displayName;
      } else {
        document.getElementById("current-name").innerText = "未登入成員";
      }
    }

    function ensureLoggedIn() {
      if (typeof liff !== "undefined" && liff.isLoggedIn && !liff.isLoggedIn()) {
        if (confirm("🔒 辦活動與報名參加需要連動 LINE 帳號，是否立即登入？")) {
          liff.login();
        }
        return false;
      }
      if (!currentUser) {
        alert("🔒 請先登入 LINE 帳號後再進行操作！");
        return false;
      }
      return true;
    }

    // --- 4. GOOGLE SHEETS / GAS API SYNC ---
    async function fetchRemoteDataFromGAS() {
      if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.indexOf("YOUR_GAS_API_URL") >= 0) return;

      try {
        const res = await fetch(CONFIG.GAS_API_URL, { redirect: "follow" });
        const data = await res.json();
        
        if (data && data.status === "success") {
          if (data.events && Array.isArray(data.events)) {
            eventsData = data.events;
            saveLocalEvents();
          }
          if (data.notice) {
            noticeData.currentContent = data.notice.content;
            noticeData.lastAuthor = data.notice.author;
            noticeData.lastTime = data.notice.timestamp;
            noticeData.history = data.noticeHistory || noticeData.history;
            saveLocalNotice();
          }
        }
      } catch (err) {
        console.warn("GAS fetch fallback:", err);
      }
    }

    async function sendPostToGAS(payload) {
      if (!CONFIG.GAS_API_URL || CONFIG.GAS_API_URL.indexOf("YOUR_GAS_API_URL") >= 0) return;

      try {
        await fetch(CONFIG.GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });
      } catch (err) {
        console.warn("GAS POST fallback:", err);
      }
    }

    // --- 5. LOCAL PERSISTENCE FALLBACK ---
    function loadLocalNotice() {
      const stored = localStorage.getItem(CONFIG.NOTICE_STORAGE_KEY);
      if (stored) {
        try { noticeData = JSON.parse(stored); } catch (e) {}
      }
    }

    function saveLocalNotice() {
      localStorage.setItem(CONFIG.NOTICE_STORAGE_KEY, JSON.stringify(noticeData));
    }

    function loadLocalEvents() {
      const stored = localStorage.getItem(CONFIG.STORAGE_KEY);
      if (stored) {
        try {
          eventsData = JSON.parse(stored);
          return;
        } catch (e) {}
      }

      const now = new Date();
      const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      const nextWeek = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
      const pastDay = new Date(now.getTime() - 2 * 24 * 60 * 60 * 1000);

      eventsData = [
        {
          id: "evt_1",
          title: "週末羽球夜戰",
          datetime: formatDateForInput(tomorrow, "19:30"),

          maxAttendees: 8,
          description: "請自備球拍與運動鞋，程度不限！集合後直接分組打歡樂場。",
          hostName: "小明",
          hostUser: DEV_PROFILES[0],
          createdAt: new Date().toISOString(),
          attendees: [DEV_PROFILES[0], DEV_PROFILES[1], DEV_PROFILES[2]],
          history: [{ author: "小明", time: getFormattedNow(), action: "創立了此活動" }]
        },

          id: "evt_2",
          title: "懷舊電玩酒吧聚會",
          datetime: formatDateForInput(nextWeek, "20:00"),
          location: "Continue Gaming Bar (西門町)",
          fee: "$350 (含一杯飲品)",
          maxAttendees: 6,
          description: "切磋快打旋風與瑪利歐賽車，暢聊 retro 遊戲經驗！",
          hostName: "阿傑",
          hostUser: DEV_PROFILES[1],
          createdAt: new Date().toISOString(),
          attendees: [DEV_PROFILES[1], DEV_PROFILES[3]],
          history: [{ author: "阿傑", time: getFormattedNow(), action: "創立了此活動" }]
        },
        {
          id: "evt_3",
          title: "上週桌遊團 (已過期範例)",
          datetime: formatDateForInput(pastDay, "14:00"),
          location: "瘋桌遊 (松江店)",
          fee: "$150",
          maxAttendees: 6,
          description: "體驗阿瓦隆與璀璨寶石！",
          hostName: "小美",
          hostUser: DEV_PROFILES[2],
          createdAt: new Date().toISOString(),
          attendees: [DEV_PROFILES[2], DEV_PROFILES[0]],
          history: [{ author: "小美", time: getFormattedNow(), action: "創立了此活動" }]
        }
      ];

      saveLocalEvents();
    }

    function loadLocalData() {
      loadLocalEvents();
      loadLocalNotice();
    }

    function saveLocalEvents() {
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(eventsData));
    }

    function formatDateForInput(dateObj, timeStr) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}T${timeStr}`;
    }

    function getFormattedNow() {
      const d = new Date();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      const hour = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${month}/${date} ${hour}:${min}`;
    }

    // --- 6. LOCATION URL AUTO-LINK FORMATTER ---
    function formatLocationHtml(locationStr) {
      if (!locationStr) return "線上 / 待定";
      
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      if (urlRegex.test(locationStr)) {
        return locationStr.replace(urlRegex, function(url) {
          return `<a href="${url}" target="_blank" class="location-link" onclick="event.stopPropagation();">📍 點擊開啟地圖連結</a>`;
        });
      }
      
      return escapeHtml(locationStr);
    }

    // --- 7. RENDER EVENTS & CARDS ---

      document.getElementById("notice-text-content").innerText = noticeData.currentContent || "目前尚無公告。";

    }

    function renderEvents() {
      const listEl = document.getElementById("event-list");
      listEl.innerHTML = "";

      const exportBtn = document.getElementById("btn-export-ended");
      if (currentFilter === "ended") {
        exportBtn.style.display = "block";
      } else {
        exportBtn.style.display = "none";
      }

      const sortedEvents = [...eventsData].sort((a, b) => parseSafeDate(a.datetime) - parseSafeDate(b.datetime));
      
      const filteredEvents = sortedEvents.filter(evt => {
        const isEnded = parseSafeDate(evt.datetime) < new Date();
        const isFull = evt.maxAttendees > 0 && evt.attendees.length >= evt.maxAttendees;

        if (currentFilter === "open") {
          return !isEnded && !isFull;
        }
        if (currentFilter === "ended") {
          return isEnded;
        }
        if (currentFilter === "my") {
          return currentUser ? evt.attendees.some(u => u.userId === currentUser.userId) : false;
        }
        return true;
      });

      if (filteredEvents.length === 0) {
        listEl.innerHTML = `
          <div style="background:#ffffff; border-radius:16px; padding:30px; text-align:center; color:#64748b; box-shadow:0 4px 14px rgba(0,0,0,0.08);">
            <p style="font-size:16px; font-weight:bold;">💬 目前沒有相關活動記錄</p>
          </div>
        `;
        return;
      }

      filteredEvents.forEach(evt => {
        const isEnded = parseSafeDate(evt.datetime) < new Date();
        const isFull = evt.maxAttendees > 0 && evt.attendees.length >= evt.maxAttendees;
        const isAttending = currentUser ? evt.attendees.some(u => u.userId === currentUser.userId) : false;
        
        let tagClass = "tag-open";
        let tagText = "報名中";
        
        if (isEnded) {
          tagClass = "tag-ended";
          tagText = "已過期";
        } else if (isFull) {
          tagClass = "tag-full";
          tagText = "已額滿";
        }

        const formattedTime = parseSafeDate(evt.datetime).toLocaleString("zh-TW", {
          month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", weekday: "short"
        });

        const cardEl = document.createElement("div");
        cardEl.className = `event-card ${isEnded ? 'ended' : ''}`;

        let rsvpBtnHtml = "";
        if (isEnded) {
          rsvpBtnHtml = `<button class="line-btn" style="background:#e2e8f0; color:#94a3b8;" disabled>已過期</button>`;
        } else if (isAttending) {
          rsvpBtnHtml = `<button class="line-btn btn-cancel" onclick="toggleRSVP('${evt.id}')">取消參加</button>`;
        } else if (isFull) {
          rsvpBtnHtml = `<button class="line-btn" style="background:#e2e8f0; color:#94a3b8;" disabled>已額滿</button>`;
        } else {
          rsvpBtnHtml = `<button class="line-btn btn-join" onclick="toggleRSVP('${evt.id}')">參加活動</button>`;
        }

        const gcalUrl = generateGoogleCalendarUrl(evt);
        const locationHtml = formatLocationHtml(evt.location);

        cardEl.innerHTML = `
          <div class="card-header">
            <div class="card-title">${escapeHtml(evt.title)}</div>
            <div class="tag-badge ${tagClass}">${tagText}</div>
          </div>
          
          <div class="card-info">
            <div class="info-row"><span class="info-label">⏰ 時間：</span><span>${formattedTime}</span></div>
            <div class="info-row"><span class="info-label">📍 地點：</span><span>${locationHtml}</span></div>
            <div class="info-row"><span class="info-label">💰 費用：</span><span>${escapeHtml(evt.fee || "免費")}</span></div>
            <div class="info-row"><span class="info-label">👑 主揪：</span><span>${escapeHtml(evt.hostName || evt.hostUser?.displayName || "無")}</span></div>
            <div class="info-row">
              <span class="info-label">👥 人數：</span>
              <span style="color:var(--line-green-dark); font-weight:bold;">${evt.attendees.length}${evt.maxAttendees > 0 ? '/' + evt.maxAttendees : ''} 人</span>
            </div>
          </div>

          <div class="card-actions">
            ${rsvpBtnHtml}
            <button class="line-btn btn-detail" onclick="openDetailModal('${evt.id}')">詳情</button>
            <a class="line-btn btn-calendar" href="${gcalUrl}" target="_blank">加到行事曆</a>
          </div>
        `;

        listEl.appendChild(cardEl);
      });
    }

    // --- 8. NOTICE BOARD HANDLERS ---
    document.getElementById("form-edit-notice").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!ensureLoggedIn()) return;

      const text = document.getElementById("input-notice-text").value.trim();
      if (!text) return;

      const nowStr = getFormattedNow();
      noticeData.currentContent = text;
      noticeData.lastAuthor = currentUser.displayName;
      noticeData.lastTime = nowStr;

      noticeData.history = noticeData.history || [];
      noticeData.history.unshift({
        author: currentUser.displayName,
        time: nowStr,
        content: text
      });

      saveLocalNotice();
      sendPostToGAS({ action: "updateNotice", content: text, author: currentUser.displayName });
      
      renderNoticeBoard();
      closeModal("modal-edit-notice");

      const noticeShareText = `📌【群組最新重要公告】\n${text}\n由 ${currentUser.displayName} 發布於 ${nowStr}`;
      safeCopyText(noticeShareText);

      document.getElementById("alert-copied-text").innerText = noticeShareText;
      openModal("modal-copy-alert");
    });

    // --- 9. BROADCAST ALL OPEN EVENTS ---
    function broadcastOpenEvents() {
      const openEvents = eventsData
        .filter(evt => {
          const isEnded = parseSafeDate(evt.datetime) < new Date();
          const isFull = evt.maxAttendees > 0 && evt.attendees.length >= evt.maxAttendees;
          return !isEnded && !isFull;
        })
        .sort((a, b) => parseSafeDate(a.datetime) - parseSafeDate(b.datetime));

      if (openEvents.length === 0) {
        alert("目前沒有開放報名中的活動可宣傳！");
        return;
      }

      const pageUrl = getShareableUrl();

      const eventBlocks = openEvents.map((evt, idx) => {
        const formattedTime = parseSafeDate(evt.datetime).toLocaleString("zh-TW", {
          month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", weekday: "short"
        });
        const capacityStr = `${evt.attendees.length}${evt.maxAttendees > 0 ? '/' + evt.maxAttendees : ''} 人`;
        
        return `${idx + 1}. 【${evt.title}】
時間：${formattedTime}
地點：${evt.location || '線上 / 待定'}
目前人數：${capacityStr}`;
      }).join("\n\n");

      const broadcastText = 
`📢【群組熱門活動總通報】
${eventBlocks}

👉 點此線上報名：
${pageUrl}`;

      safeCopyText(broadcastText);

      document.getElementById("alert-copied-text").innerText = broadcastText;
      openModal("modal-copy-alert");
    }

    // --- 10. EXPORT ENDED EVENTS FUNCTION ---
    function exportEndedEvents() {
      const endedEvents = eventsData
        .filter(evt => parseSafeDate(evt.datetime) < new Date())
        .sort((a, b) => parseSafeDate(a.datetime) - parseSafeDate(b.datetime));

      if (endedEvents.length === 0) {
        alert("目前沒有已過期的活動！");
        return;
      }

      const exportLines = endedEvents.map(evt => {
        const dt = parseSafeDate(evt.datetime);
        const yyyy = dt.getFullYear();
        const mm = String(dt.getMonth() + 1).padStart(2, '0');
        const dd = String(dt.getDate()).padStart(2, '0');
        return `[${yyyy}-${mm}-${dd}] ${evt.title} (${evt.location || '線上 / 待定'})`;
      });

      const exportText = `📋【已過期活動歷史紀錄】\n` + exportLines.join("\n");

      safeCopyText(exportText);
      document.getElementById("alert-copied-text").innerText = exportText;
      openModal("modal-copy-alert");
    }

    // --- 11. RSVP TOGGLE & COPIED NOTIFICATION ---
    function toggleRSVP(eventId) {
      if (!ensureLoggedIn()) return;

      const evt = eventsData.find(e => e.id === eventId);
      if (!evt) return;

      const isEnded = parseSafeDate(evt.datetime) < new Date();
      if (isEnded) return;

      const existingIdx = evt.attendees.findIndex(u => u.userId === currentUser.userId);
      let actionType = "";

      if (existingIdx >= 0) {
        evt.attendees.splice(existingIdx, 1);
        actionType = "cancel";
        evt.history = evt.history || [];
        evt.history.unshift({ author: currentUser.displayName, time: getFormattedNow(), action: "取消了參加報名" });
      } else {
        if (evt.maxAttendees > 0 && evt.attendees.length >= evt.maxAttendees) {
          alert("此活動人數已額滿！");
          return;
        }
        evt.attendees.push(currentUser);
        actionType = "join";
        evt.history = evt.history || [];
        evt.history.unshift({ author: currentUser.displayName, time: getFormattedNow(), action: "報名參加了活動" });
      }

      saveLocalEvents();
      sendPostToGAS({
        action: "toggleRSVP",
        eventId: evt.id,
        userId: currentUser.userId,
        displayName: currentUser.displayName,
        pictureUrl: currentUser.pictureUrl
      });

      renderEvents();
      triggerAutoCopyAndAlert(evt, actionType);
    }

    // --- 12. AUTO-COPY SINGLE EVENT TRIGGER (取消發送「已跳game OO活動」) ---
    function triggerAutoCopyAndAlert(evt, actionType) {
      const formattedTime = parseSafeDate(evt.datetime).toLocaleString("zh-TW", {
        month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", weekday: "short"
      });

      const pageUrl = getShareableUrl();
      
      // 💔 取消參加：極簡單行「已跳game OO活動」
      if (actionType === "cancel") {
        const cancelText = `已跳game【${evt.title}】`;
        safeCopyText(cancelText);
        document.getElementById("alert-copied-text").innerText = cancelText;
        openModal("modal-copy-alert");
        return;
      }

      const attendeeNames = evt.attendees.map(u => u.displayName).join(", ");
      let headline = "";
      if (actionType === "join") {
        headline = `已報名【${evt.title}】`;
      } else if (actionType === "create") {
        headline = `已發起揪團【${evt.title}】`;
      } else {
        headline = `已更新【${evt.title}】`;
      }

      const textToCopy = 
`${headline}
主題：${evt.title}
日期：${formattedTime}
報名人：${attendeeNames || '尚無'}

👉 點此線上報名：
${pageUrl}`;

      safeCopyText(textToCopy);

      document.getElementById("alert-copied-text").innerText = textToCopy;
      openModal("modal-copy-alert");
    }

    // --- 13. EVENT CREATION ---
    document.getElementById("form-create-event").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!ensureLoggedIn()) return;

      const customHostName = document.getElementById("input-host-name").value.trim();

      const newEvent = {
        id: "evt_" + Date.now(),
        title: document.getElementById("input-title").value.trim(),
        datetime: document.getElementById("input-datetime").value,
        location: document.getElementById("input-location").value.trim() || "線上 / 待定",
        fee: document.getElementById("input-fee").value.trim() || "免費",
        maxAttendees: parseInt(document.getElementById("input-max").value) || 0,
        description: document.getElementById("input-desc").value.trim(),
        hostName: customHostName || currentUser.displayName,
        hostUser: currentUser,
        createdAt: new Date().toISOString(),
        attendees: [currentUser],
        history: [
          { author: currentUser.displayName, time: getFormattedNow(), action: "創立了此活動" }
        ]
      };

      eventsData.push(newEvent);
      saveLocalEvents();
      sendPostToGAS({ action: "saveEvent", ...newEvent });

      renderEvents();
      closeModal("modal-create");
      document.getElementById("form-create-event").reset();

      triggerAutoCopyAndAlert(newEvent, "create");
    });

    // --- 14. GOOGLE CALENDAR GENERATOR ---
    function generateGoogleCalendarUrl(evt) {
      const startDt = parseSafeDate(evt.datetime);
      const endDt = new Date(startDt.getTime() + 2 * 60 * 60 * 1000);

      const formatGCalDate = (dt) => {
        return dt.toISOString().replace(/-|:|\.\d\d\d/g, "");
      };

      const title = encodeURIComponent(`[活動] ${evt.title}`);
      const details = encodeURIComponent(`主揪: ${evt.hostName || evt.hostUser?.displayName}\n費用: ${evt.fee}\n說明: ${evt.description}`);
      const location = encodeURIComponent(evt.location || "線上 / 待定");
      const dates = `${formatGCalDate(startDt)}/${formatGCalDate(endDt)}`;

      return `https://www.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&location=${location}`;
    }

    // --- 15. EDIT EVENT SUBMISSION LOGIC ---
    document.getElementById("form-edit-event").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!ensureLoggedIn()) return;
      
      if (!activeEventId) return;
      const evt = eventsData.find(e => e.id === activeEventId);
      if (!evt) return;

      const newTitle = document.getElementById("edit-title").value.trim();
      const newDatetime = document.getElementById("edit-datetime").value;
      const newLocation = document.getElementById("edit-location").value.trim() || "線上 / 待定";
      const newHostName = document.getElementById("edit-host-name").value.trim();
      const newFee = document.getElementById("edit-fee").value.trim() || "免費";
      const newMax = parseInt(document.getElementById("edit-max").value) || 0;
      const newDesc = document.getElementById("edit-desc").value.trim();

      let changes = [];
      if (evt.title !== newTitle) changes.push(`名稱(${newTitle})`);
      if (evt.datetime !== newDatetime) changes.push("時間");
      if (evt.location !== newLocation) changes.push("地點");
      if (evt.hostName !== newHostName) changes.push(`主揪(${newHostName})`);
      if (evt.fee !== newFee) changes.push("費用");
      if (evt.maxAttendees !== newMax) changes.push("人數");
      if (evt.description !== newDesc) changes.push("補充說明");

      if (changes.length === 0) {
        closeModal("modal-edit");
        return;
      }

      evt.title = newTitle;
      evt.datetime = newDatetime;
      evt.location = newLocation;
      evt.hostName = newHostName;
      evt.fee = newFee;
      evt.maxAttendees = newMax;
      evt.description = newDesc;

      evt.history = evt.history || [];
      evt.history.unshift({
        author: currentUser.displayName,
        time: getFormattedNow(),
        action: `更新了：${changes.join("、")}`
      });

      saveLocalEvents();
      sendPostToGAS({ action: "saveEvent", ...evt });

      renderEvents();
      closeModal("modal-edit");

      openDetailModal(evt.id);

      triggerAutoCopyAndAlert(evt, "update");
    });

    // --- 16. DETAIL MODAL & @MENTION & EDIT / DELETE ---
    function openDetailModal(eventId) {
      activeEventId = eventId;
      const evt = eventsData.find(e => e.id === eventId);
      if (!evt) return;

      const formattedTime = parseSafeDate(evt.datetime).toLocaleString("zh-TW", {
        year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", weekday: "short"
      });

      document.getElementById("detail-title").innerText = evt.title;
      document.getElementById("detail-time").innerText = formattedTime;
      document.getElementById("detail-location").innerHTML = formatLocationHtml(evt.location);
      document.getElementById("detail-fee").innerText = evt.fee || "免費";
      
      document.getElementById("detail-host-input").value = evt.hostName || evt.hostUser?.displayName || "";
      document.getElementById("detail-desc").innerText = evt.description || "尚無補充說明。";
      document.getElementById("detail-capacity-text").innerText = 
        `${evt.attendees.length}${evt.maxAttendees > 0 ? '/' + evt.maxAttendees : ''}`;

      const attendeesEl = document.getElementById("detail-attendees");
      if (evt.attendees.length === 0) {
        attendeesEl.innerHTML = `<span style="color:#64748b;">目前尚無成員報名</span>`;
      } else {
        attendeesEl.innerHTML = evt.attendees.map(u => `
          <div class="attendee-pill" style="padding:4px 10px 4px 6px;">
            <img src="${u.pictureUrl || 'https://api.dicebear.com/7.x/pixel-art/svg?seed=' + u.displayName}" alt="Avatar">
            <span>${escapeHtml(u.displayName)}</span>
          </div>
        `).join("");
      }

      const historyEl = document.getElementById("detail-history-list");
      if (!evt.history || evt.history.length === 0) {
        historyEl.innerHTML = `<div style="color:#94a3b8; font-size:12px;">尚無編修紀錄</div>`;
      } else {
        historyEl.innerHTML = evt.history.map(log => `
          <div class="history-item">
            <span class="history-meta">👤 ${escapeHtml(log.author)} (${log.time})</span>：${escapeHtml(log.action)}
          </div>
        `).join("");
      }

      document.getElementById("btn-trigger-edit").onclick = () => {
        if (!ensureLoggedIn()) return;
        closeModal("modal-detail");
        
        document.getElementById("edit-title").value = evt.title;
        document.getElementById("edit-datetime").value = evt.datetime;
        document.getElementById("edit-location").value = evt.location || "";
        document.getElementById("edit-host-name").value = evt.hostName || "";
        document.getElementById("edit-fee").value = evt.fee || "";
        document.getElementById("edit-max").value = evt.maxAttendees || 0;
        document.getElementById("edit-desc").value = evt.description || "";

        openModal("modal-edit");
      };

      document.getElementById("btn-mention-attendees").onclick = () => {
        if (evt.attendees.length === 0) {
          alert("目前沒有已報名的成員可標記！");
          return;
        }

        const mentionsText = evt.attendees.map(u => `@${u.displayName}`).join(" ");
        const mentionNoticeText = 
`🏷️【活動成員提醒：${evt.title}】
時間：${formattedTime}
成員：${mentionsText}

各位記得準時出席活動唷！`;

        safeCopyText(mentionNoticeText);
        document.getElementById("alert-copied-text").innerText = mentionNoticeText;
        openModal("modal-copy-alert");
      };

      document.getElementById("btn-save-host").onclick = () => {
        if (!ensureLoggedIn()) return;
        const newHostName = document.getElementById("detail-host-input").value.trim();
        if (newHostName && newHostName !== evt.hostName) {
          evt.hostName = newHostName;
          evt.history = evt.history || [];
          evt.history.unshift({
            author: currentUser.displayName,
            time: getFormattedNow(),
            action: `修改主揪為「${newHostName}」`
          });
          saveLocalEvents();
          sendPostToGAS({ action: "saveEvent", ...evt });

          renderEvents();
          openDetailModal(evt.id);
          alert("✅ 已更新主揪名稱！");
        }
      };

      document.getElementById("btn-delete-event").onclick = () => {
        if (!ensureLoggedIn()) return;
        if (confirm(`⚠️ 確定要刪除活動「${evt.title}」嗎？此操作不可復原。`)) {
          eventsData = eventsData.filter(e => e.id !== eventId);
          saveLocalEvents();
          sendPostToGAS({ action: "deleteEvent", eventId: eventId });
          renderEvents();
          closeModal("modal-detail");
          alert("已成功刪除活動！");
        }
      };

      openModal("modal-detail");
    }

    function openModal(id) {
      document.getElementById(id).classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    // --- 17. DEV PROFILES ---
    function renderDevProfiles() {
      const container = document.getElementById("dev-profiles-container");
      container.innerHTML = DEV_PROFILES.map(prof => `
        <div class="dev-card ${currentUser && prof.userId === currentUser.userId ? 'active' : ''}" onclick="switchDevProfile('${prof.userId}')">
          <img src="${prof.pictureUrl}" width="20" height="20" style="border-radius:50%; vertical-align:middle; margin-right:4px;">
          ${escapeHtml(prof.displayName)}
        </div>
      `).join("");
    }

    function switchDevProfile(userId) {
      const target = DEV_PROFILES.find(p => p.userId === userId);
      if (target) {
        currentUser = target;
        localStorage.setItem(CONFIG.USER_CACHE_KEY, JSON.stringify(currentUser));
        updateUserUI();
        renderDevProfiles();
        renderEvents();
        closeModal("modal-dev-profile");
      }
    }

    // --- 18. EVENT LISTENERS ---
    function setupEventListeners() {
      document.getElementById("fab-add-event").onclick = () => {
        if (!ensureLoggedIn()) return;
        const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000);
        document.getElementById("input-datetime").value = formatDateForInput(tomorrow, "19:00");
        document.getElementById("input-host-name").value = currentUser ? currentUser.displayName : "";
        openModal("modal-create");
      };

      document.getElementById("btn-broadcast-all").onclick = () => {
        broadcastOpenEvents();
      };

      document.getElementById("btn-edit-notice").onclick = () => {
        if (!ensureLoggedIn()) return;
        document.getElementById("input-notice-text").value = noticeData.currentContent || "";
        openModal("modal-edit-notice");
      };

      document.getElementById("btn-notice-history").onclick = () => {
        const historyContainer = document.getElementById("notice-history-container");
        if (!noticeData.history || noticeData.history.length === 0) {
          historyContainer.innerHTML = `<div style="color:#94a3b8; font-size:12px;">尚無公告留言紀錄</div>`;
        } else {
          historyContainer.innerHTML = noticeData.history.map(item => `
            <div class="history-item">
              <div class="history-meta">👤 ${escapeHtml(item.author)} (${item.time})</div>
              <div style="margin-top:2px;">${escapeHtml(item.content)}</div>
            </div>
          `).join("");
        }
        openModal("modal-notice-history");
      };

      document.getElementById("btn-dev-toggle").onclick = () => {
        openModal("modal-dev-profile");
      };

      document.getElementById("btn-export-ended").onclick = () => {
        exportEndedEvents();
      };

      document.querySelectorAll("[data-close]").forEach(btn => {
        btn.onclick = () => closeModal(btn.getAttribute("data-close"));
      });

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.getAttribute("data-filter");
          renderEvents();
        };
      });
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
