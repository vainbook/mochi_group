<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💬 LINE 群組活動布告欄</title>
  
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Native LINE UI Style CSS Embedded -->
  <style>
    /* ==========================================================================
       NATIVE LINE CHAT UI DESIGN SYSTEM (SEAMLESS LINE STYLE)
       ========================================================================== */

    :root {
      /* LINE Palette */
      --line-green: #06C755;
      --line-green-dark: #05b34c;
      --line-green-light: #e6f9ed;
      --line-bg: #8cabd9; /* Classic LINE Chatroom Blue-Gray */
      --line-card-bg: #ffffff;
      --line-text-main: #1e1e1e;
      --line-text-sub: #666666;
      --line-border: #e2e8f0;
      --line-red: #ff4b4b;
      --line-yellow: #ffb800;
      
      /* System Font */
      --font-line: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--line-bg);
      color: var(--line-text-main);
      font-family: var(--font-line);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Native LINE Header */
    .line-header {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--line-green);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .user-name {
      font-weight: 700;
      color: #0f172a;
    }

    .dev-btn {
      background: #ffffff;
      border: 1px solid var(--line-green);
      color: var(--line-green);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dev-btn:hover {
      background: var(--line-green);
      color: #ffffff;
    }

    /* Top Announcement Notice Board */
    .notice-board {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      border-left: 5px solid var(--line-yellow);
    }

    .notice-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .notice-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notice-content {
      background: #fffbeb;
      border: 1px solid #fef3c7;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      color: #92400e;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 8px;
    }

    .notice-meta {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Navigation Pill Tabs */
    .nav-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      align-items: center;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: none;
      color: #475569;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .tab-btn.active {
      background: var(--line-green);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(6, 199, 85, 0.3);
    }

    .export-btn {
      background: #1e293b;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-left: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      white-space: nowrap;
    }

    .export-btn:hover {
      background: #0f172a;
    }

    /* LINE Event Cards */
    .event-card {
      background: var(--line-card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .event-card.ended {
      background: #f8fafc;
      opacity: 0.85;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .tag-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .tag-open {
      background: var(--line-green-light);
      color: var(--line-green-dark);
    }

    .tag-full {
      background: #ffebe6;
      color: var(--line-red);
    }

    .tag-ended {
      background: #e2e8f0;
      color: #64748b;
    }

    .card-info {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .info-row {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: #64748b;
      font-weight: 600;
      min-width: 60px;
    }

    .location-link {
      color: #2563eb;
      text-decoration: underline;
      font-weight: 600;
      word-break: break-all;
    }

    .location-link:hover {
      color: #1d4ed8;
    }

    /* Card Attendees Preview Pills */
    .attendee-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 3px 8px 3px 4px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .attendee-pill img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Card Buttons Grid */
    .card-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .line-btn {
      font-family: var(--font-line);
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-join {
      background: var(--line-green);
      color: #ffffff;
    }

    .btn-join:hover {
      background: var(--line-green-dark);
    }

    .btn-cancel {
      background: #ef4444;
      color: #ffffff;
    }

    .btn-cancel:hover {
      background: #dc2626;
    }

    .btn-detail {
      background: #f1f5f9;
      color: #334155;
    }

    .btn-detail:hover {
      background: #e2e8f0;
    }

    .btn-edit {
      background: #fef3c7;
      color: #d97706;
      border: 1px solid #fde68a;
    }

    .btn-edit:hover {
      background: #fde68a;
      color: #b45309;
    }

    .btn-calendar {
      background: #eff6ff;
      color: #2563eb;
    }

    .btn-calendar:hover {
      background: #dbeafe;
    }

    .btn-delete {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
    }

    .btn-delete:hover {
      background: #fca5a5;
      color: #7f1d1d;
    }

    /* Floating Action Button (FAB) Group */
    .fab-group {
      position: fixed;
      bottom: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      z-index: 100;
    }

    .fab-btn {
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-family: var(--font-line);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .fab-btn:hover {
      transform: scale(1.04);
    }

    .fab-add {
      background: var(--line-green);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(6, 199, 85, 0.4);
    }

    .fab-add:hover {
      background: var(--line-green-dark);
    }

    .fab-broadcast {
      background: #ffb800;
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(255, 184, 0, 0.4);
    }

    .fab-broadcast:hover {
      background: #e6a600;
    }

    /* Modal Overlay & Box */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: #f1f5f9;
      border: none;
      color: #64748b;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }

    .line-input, .line-textarea {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      padding: 12px;
      border-radius: 10px;
      font-family: var(--font-line);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="datetime-local"].line-input {
      min-height: 46px;
      color: #0f172a;
      background-color: #f8fafc;
      cursor: pointer;
    }

    .line-input:focus, .line-textarea:focus {
      border-color: var(--line-green);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15);
    }

    .line-textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* History Log List */
    .history-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #e2e8f0;
      max-height: 140px;
      overflow-y: auto;
    }

    .history-item {
      font-size: 12px;
      color: #475569;
      padding: 6px 0;
      border-bottom: 1px dashed #cbd5e1;
      line-height: 1.4;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-meta {
      font-weight: bold;
      color: var(--line-green-dark);
    }

    /* Alert Textbox */
    .alert-text-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: #334155;
      margin: 14px 0;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      text-align: left;
      line-height: 1.6;
      border-left: 4px solid var(--line-green);
    }

    /* Dev Profile Cards */
    .dev-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .dev-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      color: #334155;
      transition: all 0.2s;
    }

    .dev-card.active, .dev-card:hover {
      border-color: var(--line-green);
      background: var(--line-green-light);
      color: var(--line-green-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LINE Native Header -->
    <header class="line-header">
      <div class="header-top">
        <h1 class="brand-title">
          <span>💬 群組活動布告欄</span>
        </h1>
        <span style="font-size: 12px; color: var(--line-green); background: var(--line-green-light); padding: 3px 8px; border-radius: 10px; font-weight: 700;">LIFF APP</span>
      </div>
      
      <div class="user-status-bar">
        <div>
          <span style="color: #64748b;">登入身份：</span>
          <span id="current-name" class="user-name">載入中...</span>
          <span id="liff-status" style="font-size: 11px; margin-left: 4px; color: var(--line-green);">[INIT]</span>
        </div>
        <button id="btn-dev-toggle" class="dev-btn">⚙️ 切換測試身分</button>
      </div>
    </header>

    <!-- Top Announcement Board -->
    <section class="notice-board">
      <div class="notice-title-row">
        <div class="notice-title">📌 群組重要公告</div>
        <div style="display:flex; gap:6px;">
          <button id="btn-edit-notice" class="line-btn btn-edit" style="padding:3px 8px; font-size:12px;">✏️ 發表/修改</button>
          <button id="btn-notice-history" class="line-btn btn-detail" style="padding:3px 8px; font-size:12px;">📜 歷史留言</button>
        </div>
      </div>
      <div id="notice-text-content" class="notice-content">
        載入公告中...
      </div>
      <div class="notice-meta">
        <span id="notice-author-info">由 管理員 發布</span>
        <span id="notice-time-info">--</span>
      </div>
    </section>

    <!-- Navigation Tabs (Default: 報名中) -->
    <nav class="nav-filters">
      <button class="tab-btn active" data-filter="open">報名中</button>
      <button class="tab-btn" data-filter="all">全部</button>
      <button class="tab-btn" data-filter="ended">已過期</button>
      <button class="tab-btn" data-filter="my">我參加的</button>
      
      <button id="btn-export-ended" class="export-btn" style="display: none;">
        📋 匯出歷史紀錄
      </button>
    </nav>

    <!-- Event Cards Container -->
    <main id="event-list">
      <!-- Dynamic Rendered Event Cards -->
    </main>

  </div>

  <!-- Floating Action Buttons Group -->
  <div class="fab-group">
    <button id="btn-broadcast-all" class="fab-btn fab-broadcast">
      <span>📣 一鍵宣傳</span>
    </button>
    <button id="fab-add-event" class="fab-btn fab-add">
      <span>➕ 創立活動</span>
    </button>
  </div>

  <!-- Modal: Edit Top Announcement / Notice -->
  <div id="modal-edit-notice" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">
        <span>📌 發表/更新頂部公告</span>
        <button class="modal-close" data-close="modal-edit-notice">✕</button>
      </div>
      <form id="form-edit-notice">
        <div class="form-group">
          <label class="form-label">公告內容 (發布後會更新至頂部，並留存留言紀錄)</label>
          <textarea id="input-notice-text" class="line-textarea" style="min-height:120px;" placeholder="寫下要提醒群組大家的注意事項..." required></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button type="button" class="line-btn btn-detail" style="flex:1;" data-close="modal-edit-notice">取消</button>
          <button type="submit" class="line-btn btn-join" style="flex:1.5;">📢 發布公告並複製通報</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Notice History Logs -->
  <div id="modal-notice-history" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">
        <span>📜 頂部公告歷史留言紀錄</span>
        <button class="modal-close" data-close="modal-notice-history">✕</button>
      </div>
      <div id="notice-history-container" class="history-box" style="max-height:260px;">
        <!-- Rendered History -->
      </div>
      <div style="margin-top:16px; text-align:right;">
        <button class="line-btn btn-detail" data-close="modal-notice-history">關閉</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create Event -->
  <div id="modal-create" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">
        <span>➕ 創立活動</span>
        <button class="modal-close" data-close="modal-create">✕</button>
      </div>
      <form id="form-create-event">
        <div class="form-group">
          <label class="form-label">活動名稱 *</label>
          <input type="text" id="input-title" class="line-input" placeholder="例如：週末羽球同樂會" required>
        </div>
        <div class="form-group">
          <label class="form-label">日期與時間 * (點擊選擇)</label>
          <input type="datetime-local" id="input-datetime" class="line-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">活動地點 * (輸入網址會自動轉為超連結)</label>
          <input type="text" id="input-location" class="line-input" placeholder="例如：台北市立羽球館 或 貼上 Google Maps 網址" required>
        </div>
        <div class="form-group">
          <label class="form-label">主揪 / 主辦人名稱</label>
          <input type="text" id="input-host-name" class="line-input" placeholder="預設為當前 LINE 暱稱（可修改）">
        </div>
        <div class="form-group">
          <label class="form-label">活動費用</label>
          <input type="text" id="input-fee" class="line-input" placeholder="例如：$200 / 人 或 免費">
        </div>
        <div class="form-group">
          <label class="form-label">人數上限 (0 代表無限制)</label>
          <input type="number" id="input-max" class="line-input" value="8" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">補充說明</label>
          <textarea id="input-desc" class="line-textarea" placeholder="例如：請自備球拍、穿著運動鞋！"></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button type="button" class="line-btn btn-detail" style="flex:1;" data-close="modal-create">取消</button>
          <button type="submit" class="line-btn btn-join" style="flex:1.5;">⚡ 發布活動</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Edit Event -->
  <div id="modal-edit" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">
        <span>✏️ 編輯活動內容</span>
        <button class="modal-close" data-close="modal-edit">✕</button>
      </div>
      <form id="form-edit-event">
        <div class="form-group">
          <label class="form-label">活動名稱 *</label>
          <input type="text" id="edit-title" class="line-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">日期與時間 *</label>
          <input type="datetime-local" id="edit-datetime" class="line-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">活動地點 *</label>
          <input type="text" id="edit-location" class="line-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">主揪名稱</label>
          <input type="text" id="edit-host-name" class="line-input">
        </div>
        <div class="form-group">
          <label class="form-label">活動費用</label>
          <input type="text" id="edit-fee" class="line-input">
        </div>
        <div class="form-group">
          <label class="form-label">人數上限 (0 代表無限制)</label>
          <input type="number" id="edit-max" class="line-input" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">補充說明</label>
          <textarea id="edit-desc" class="line-textarea"></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:18px;">
          <button type="button" class="line-btn btn-detail" style="flex:1;" data-close="modal-edit">取消</button>
          <button type="submit" class="line-btn btn-join" style="flex:1.5;">💾 儲存並更新通報</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Event Detail & History Logs -->
  <div id="modal-detail" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">
        <span id="detail-title">📖 活動詳情</span>
        <div style="display:flex; gap:6px;">
          <button id="btn-trigger-edit" class="line-btn btn-edit" style="padding:4px 10px; font-size:12px;">✏️ 編輯內容</button>
          <button class="modal-close" data-close="modal-detail">✕</button>
        </div>
      </div>
      
      <div style="background:#f8fafc; border-radius:12px; padding:12px; margin-bottom:14px; border:1px solid #e2e8f0;">
        <div style="margin-bottom:8px;"><strong>⏰ 時間：</strong><span id="detail-time">--</span></div>
        <div style="margin-bottom:8px;"><strong>📍 地點：</strong><span id="detail-location">--</span></div>
        <div style="margin-bottom:8px;"><strong>💰 費用：</strong><span id="detail-fee">--</span></div>
        
        <!-- Editable Host Section -->
        <div style="display:flex; align-items:center; gap:8px;">
          <strong>👑 主揪：</strong>
          <input type="text" id="detail-host-input" class="line-input" style="padding:4px 8px; font-size:13px; width:150px; height:32px;">
          <button id="btn-save-host" class="line-btn btn-join" style="padding:4px 10px; font-size:12px;">儲存</button>
        </div>
      </div>

      <div style="margin-bottom:14px;">
        <div style="font-weight:700; color:#475569; margin-bottom:4px;">📝 具體活動說明：</div>
        <div id="detail-desc" style="background:#f8fafc; padding:12px; border-radius:10px; border:1px solid #e2e8f0; white-space:pre-wrap; color:#334155;">--</div>
      </div>

      <div style="margin-bottom:14px;">
        <div style="font-weight:700; color:#475569; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
          <span>👥 已報名成員名冊 (<span id="detail-capacity-text" style="color:var(--line-green); font-weight:bold;">0/0</span>)：</span>
          <button id="btn-mention-attendees" class="line-btn btn-calendar" style="padding:4px 10px; font-size:12px;">
            🏷️ @標記成員
          </button>
        </div>
        <div id="detail-attendees" style="background:#f8fafc; padding:10px; border-radius:10px; border:1px solid #e2e8f0; max-height:140px; overflow-y:auto; display:flex; flex-wrap:wrap; gap:6px;">
          <!-- Attendees -->
        </div>
      </div>

      <!-- History Update Logs -->
      <div>
        <div style="font-weight:700; color:#475569; margin-bottom:6px;">📜 編輯與更新歷史紀錄：</div>
        <div id="detail-history-list" class="history-box">
          <!-- History log items -->
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="btn-delete-event" class="line-btn btn-delete" style="flex:1;">
          🗑️ 刪除活動
        </button>
        <button class="line-btn btn-detail" style="flex:1;" data-close="modal-detail">
          關閉視窗
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Auto-Copy & Alert Notice -->
  <div id="modal-copy-alert" class="modal-overlay">
    <div class="modal-box" style="text-align:center;">
      <div style="font-size:36px; margin-bottom:6px;">📋✅</div>
      <div style="font-size:18px; color:#0f172a; font-weight:800; margin-bottom:6px;">
        已自動複製說明與標記文字！
      </div>
      <p style="font-size:14px; color:#64748b; margin-bottom:12px;">
        已將格式化內容複製到剪貼簿，請貼到 LINE 群組囉！
      </p>

      <div id="alert-copied-text" class="alert-text-box">
        <!-- Copied text content -->
      </div>

      <div style="display:flex; gap:10px; margin-top:16px;">
        <button id="btn-line-share" class="line-btn btn-join" style="flex:1.2;">
          📲 一鍵開啟 LINE 貼上
        </button>
        <button class="line-btn btn-detail" style="flex:1;" data-close="modal-copy-alert">
          關閉
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: DEV Profile Switcher -->
  <div id="modal-dev-profile" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">
        <span>⚙️ 切換測試身分</span>
        <button class="modal-close" data-close="modal-dev-profile">✕</button>
      </div>
      <p style="font-size:13px; color:#64748b; margin-bottom:10px;">
        選擇不同的測試使用者，模擬多人在群組報名與檢視名冊：
      </p>
      <div id="dev-profiles-container" class="dev-grid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- App Core JS -->
  <script src="app.js"></script>
</body>
</html>
